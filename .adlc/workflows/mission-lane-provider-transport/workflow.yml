workflow:
  id: mission-lane-provider-transport
  name: mission-lane-provider-transport
  version: "1.1.0"
description: >-
  Validation mission for the ADR-443 remote lane — workspace setup is done by
  adlc-cli, not by a skill-side script. Scope: the transport CONTRACT
  (provision-or-reuse, name expansion, secret channel, loud failure) against a
  real Coder workspace by default. Set ADLC_CODER_MOCK=1 for the offline
  contract mock; the live SSH transport is the default, not a stub.
steps:
  - id: provision
    type: shell
    run: |
      export WORKSPACE_NAME=adlc-cli-mission-lane
      export BRANCH=main
      cli="${ADLC_CLI_BIN:-adlc-cli}"
      $cli workspace setup --provider coder
  - id: verify-handle
    type: shell
    run: |
      handle=.adlc/workspaces/adlc-cli-mission-lane.json
      test -f "$handle" || { echo "missing handle $handle"; exit 1; }
      echo "handle ok: $handle"
  - id: verify-reuse
    type: shell
    run: |
      # A second run must reuse the handle, not provision a second workspace.
      cli="${ADLC_CLI_BIN:-adlc-cli}"
      export WORKSPACE_NAME=adlc-cli-mission-lane
      export BRANCH=main
      $cli workspace setup --provider coder >/dev/null
      test -f .adlc/workspaces/adlc-cli-mission-lane.json \
        || { echo "handle lost on re-run"; exit 1; }
      echo "handle reused"
  - id: verify-no-script
    type: shell
    run: |
      for p in \
        .agents/skills/factory-mission/scripts/bash/remote-coder-env-sync.sh \
        skills/factory/factory-mission/scripts/bash/remote-coder-env-sync.sh; do
        test ! -e "$p" || { echo "env-sync script still present at $p — the lane must not need it"; exit 1; }
      done
      echo "no env-sync script needed"
  - id: verify-fail-loud
    type: shell
    run: |
      # A missing ${VAR} must fail loudly and name the variable — never a
      # silent fallback.
      cli="${ADLC_CLI_BIN:-adlc-cli}"
      out=$(WORKSPACE_NAME= BRANCH=main $cli workspace setup --provider coder 2>&1) || true
      case "$out" in
        *"Missing required workspace variable"*) echo "fail-fast ok" ;;
        *) echo "expected a fail-fast on the missing variable, got: $out"; exit 1 ;;
      esac
  - id: handoff
    type: shell
    run: |
      echo "attach instructions: coder ssh adlc-cli-mission-lane"
      echo "then: opencode --prompt \"\$(cat .adlc/workflows/runs/<run_id>/brief.md)\""

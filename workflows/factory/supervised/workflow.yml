schema_version: "1.0"
workflow:
  id: factory-supervised
  name: Factory Supervised
  version: "1.0.0"
inputs:
  verdict:
    type: string
    enum: ["", approve, reject]
  issue_ref:
    type: string
    default: ""
steps:
  # Check out the mission run branch (--kind code) before any agent step
  # (ADR-431-amendment §1, §3a) so plan commits land on factory/mission/<repo>-<iid>
  # (including fresh-clone re-dispatch when origin already has the branch) and never on main.
  - id: run-branch
    type: shell
    run: |-
      node -e "const fs=require('fs'),cp=require('child_process');const dirs=['.agents/skills/factory-runbook/scripts/bash','.agents/skills/factory-mission/scripts/bash'];const names=['run-branch.sh'];const miss=[];for(const n of names){const f=dirs.map((d)=>d+'/'+n).find((p)=>fs.existsSync(p));if(!f){miss.push(n);continue}const r=cp.spawnSync('bash',[f,'--kind','code'],{stdio:'inherit'});if(r.error){console.error('run-branch: failed to spawn '+n+': '+r.error.message);process.exit(1)}if(r.status!==0)process.exit(r.status===null?1:r.status)}if(miss.length){const m='run-branch: skipped '+miss.join(', ')+' (factory-runbook helpers not installed)';console.error(m);console.log(m);const o=process.env.ADLC_STEP_OUTPUT;if(o){let d={};try{d=JSON.parse(fs.readFileSync(o,'utf8'))}catch(e){}d.skipped=m.slice(0,2000);fs.writeFileSync(o,JSON.stringify(d))}}"

  # Phase 1: Run factory-mission in plan mode (generates spec, plan & any record proposals; no code yet)
  - id: plan
    type: command
    command: factory-mission
    input:
      args: "--issue {{ inputs.issue_ref }} --plan"

  # Push the mission run branch and open/reuse the early draft MR (--kind code)
  # so gate-spec always receives mr_url even if the agent step skipped open-mr.
  - id: publish-spec
    type: shell
    run: |-
      node -e "const fs=require('fs'),cp=require('child_process');const dirs=['.agents/skills/factory-runbook/scripts/bash','.agents/skills/factory-mission/scripts/bash'];const names=['run-branch.sh','open-mr.sh'];const miss=[];for(const n of names){const f=dirs.map((d)=>d+'/'+n).find((p)=>fs.existsSync(p));if(!f){miss.push(n);continue}const r=cp.spawnSync('bash',[f,'--kind','code'],{stdio:'inherit'});if(r.error){console.error('publish-spec: failed to spawn '+n+': '+r.error.message);process.exit(1)}if(r.status!==0)process.exit(r.status===null?1:r.status)}if(miss.length){const m='publish-spec: skipped '+miss.join(', ')+' (factory-runbook helpers not installed)';console.error(m);console.log(m);const o=process.env.ADLC_STEP_OUTPUT;if(o){let d={};try{d=JSON.parse(fs.readFileSync(o,'utf8'))}catch(e){}d.skipped=m.slice(0,2000);fs.writeFileSync(o,JSON.stringify(d))}}"

  # Spec Approval Gate (HITL) — links the early draft MR and lists any proposal records
  - id: gate-spec
    type: gate
    message: "Approve specification and plan before implementation? (If status: proposed ADR/PDR drafts are listed, reject this gate, promote them to docs/adlc/memory/ via /architect-clarify + /architect-implement or /product-clarify + /product-implement, and re-run factory-supervised.)"
    context:
      records: [".adlc/drafts/adr/*.md", ".adlc/drafts/pdr/*.md"]
      since: last_approved
      link: "{{ steps.publish-spec.output.mr_url | default(steps.plan.output.mr_url) }}"
    options: [approve, reject]
    on_reject: abort
    verdict_input: verdict

  # Check out the mission run branch again after gate-spec resume: a parked run
  # restored into a fresh clone starts on the base branch and resume skips prior steps.
  - id: run-branch-execute
    type: shell
    run: |-
      node -e "const fs=require('fs'),cp=require('child_process');const dirs=['.agents/skills/factory-runbook/scripts/bash','.agents/skills/factory-mission/scripts/bash'];const names=['run-branch.sh'];const miss=[];for(const n of names){const f=dirs.map((d)=>d+'/'+n).find((p)=>fs.existsSync(p));if(!f){miss.push(n);continue}const r=cp.spawnSync('bash',[f,'--kind','code'],{stdio:'inherit'});if(r.error){console.error('run-branch-execute: failed to spawn '+n+': '+r.error.message);process.exit(1)}if(r.status!==0)process.exit(r.status===null?1:r.status)}if(miss.length){const m='run-branch-execute: skipped '+miss.join(', ')+' (factory-runbook helpers not installed)';console.error(m);console.log(m);const o=process.env.ADLC_STEP_OUTPUT;if(o){let d={};try{d=JSON.parse(fs.readFileSync(o,'utf8'))}catch(e){}d.skipped=m.slice(0,2000);fs.writeFileSync(o,JSON.stringify(d))}}"

  # Phase 2: Run factory-mission execution mode after approval
  - id: execute
    type: command
    command: factory-mission
    input:
      args: "--issue {{ inputs.issue_ref }}"

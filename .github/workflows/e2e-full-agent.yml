name: E2E Full Agent (nightly)

# Full workspace shell E2E including live agent-led parts (3+4).
# Scheduled only — never in the default push/PR path, which must stay free
# of live LLM/network dependencies (see ci.yml e2e-skip-agent).
#
# NOTE (opencode CLI): the agent-led steps spawn the `opencode` binary
# (RUN_PROFILES.opencode in src/registry.mjs), so the runner installs the
# CLI before running the script. Live runs bill the OPENCODE_API_KEY secret
# (repo Settings → Secrets → Actions); anonymous zero-auth quota is
# exhausted on shared runner IPs (nightly red since 2026-11-01). To pin a
# provider/model instead, set `model` in the opencode config.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  e2e-full-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Parts 3+4 run a live `opencode` agent; install the V2 CLI so the
      # binary is on PATH. Version is logged so a breaking CLI release is
      # visible from the run log (the nightly doubles as drift detection).
      - name: Install opencode CLI
        run: |
          npm install -g @opencode/cli
          opencode --version

      # Hermetic default: vendored skill fixture (tests/fixtures/skills-src).
      - name: Run workspace shell E2E (full agent)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash tests/e2e-workspace.sh
